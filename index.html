<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduLearn - Modern Online Education Platform Login">
    <title>EduLearn | Login</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Instant Dark Mode Initialization (Prevents Page Load Flash / FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme") || localStorage.getItem("edulearn_theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark-theme", "dark-mode");
            }
        })();
    </script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <!-- Dynamic Moving Neural Network Canvas Background -->
    <canvas id="neural-bg-canvas" class="neural-bg-canvas neural-canvas" aria-hidden="true"></canvas>

    <main class="login-container">
        <div class="login-card">
            
            <!-- Branding / Logo Header & Theme Toggle -->
            <header class="brand-header" style="position: relative;">
                <button id="theme-toggle-btn" class="btn-theme-toggle" aria-label="Toggle dark mode" title="Switch Theme" style="position: absolute; top: 0; right: 0;">
                    <span class="theme-icon" id="theme-icon">🌙</span>
                </button>
                <div class="logo-badge" aria-hidden="true">
                    <!-- Graduation Cap SVG Icon -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                </div>
                <h1 class="brand-title">Edu<span>Learn</span></h1>
                <p class="brand-subtitle">Welcome back! Please enter your details.</p>
            </header>

            <!-- Error Message Alert Box -->
            <div id="error-message" class="error-container" role="alert" aria-live="assertive">
                <!-- Alert Triangle Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-text">Invalid username or password.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" autocomplete="off" novalidate>
                
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <!-- User SVG Icon -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-control" 
                            placeholder="Enter username (e.g. student)" 
                            required
                            autofocus
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <!-- Lock SVG Icon -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter password (e.g. 12345)" 
                            required
                        >
                        <!-- Password Toggle Button -->
                        <button type="button" id="toggle-password-btn" class="toggle-password" title="Show / Hide Password" aria-label="Toggle password visibility">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="login-btn" class="btn-primary">
                    <span>Sign In</span>
                    <!-- Arrow Right SVG Icon -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

            </form>

            <!-- Test Credentials Quick Helper (College Project Demo) -->
            <div class="demo-credentials">
                <div class="demo-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span>Demo Test Credentials (Click to fill)</span>
                </div>
                <div class="demo-row">
                    <span>Username:</span>
                    <span class="demo-code" id="fill-user" title="Click to auto-fill">student</span>
                </div>
                <div class="demo-row">
                    <span>Password:</span>
                    <span class="demo-code" id="fill-pass" title="Click to auto-fill">12345</span>
                </div>
            </div>

            <!-- Footer -->
            <footer class="card-footer">
                <p>&copy; 2026 EduLearn Platform. Web Technology Project.</p>
            </footer>

        </div>
    </main>

    <!-- Authentication JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
