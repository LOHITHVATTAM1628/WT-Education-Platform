<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduLearn - Available Courses Catalog">
    <title>EduLearn | Courses</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Instant Dark Mode Initialization (Prevents Page Load Flash / FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme") || localStorage.getItem("edulearn_theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark-theme", "dark-mode");
            }
        })();
    </script>

    <!-- Global Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="courses-page">
    <!-- Dynamic Moving Neural Network Canvas Background -->
    <canvas id="neural-bg-canvas" class="neural-bg-canvas neural-canvas" aria-hidden="true"></canvas>

    <!-- ====================================================================
         1. REUSABLE NAVIGATION BAR COMPONENT
         ==================================================================== -->
    <nav class="navbar" aria-label="Main Navigation">
        <div class="navbar-container">
            
            <!-- Brand Logo -->
            <a href="dashboard.html" class="nav-brand">
                <div class="nav-brand-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                </div>
                <span class="nav-brand-name">Edu<span>Learn</span></span>
            </a>

            <!-- Mobile Navigation Toggle -->
            <button class="mobile-nav-toggle" id="mobile-toggle" aria-label="Toggle navigation menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <!-- Navigation Links -->
            <ul class="nav-menu" id="nav-menu">
                <li>
                    <a href="dashboard.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="courses.html" class="nav-link active" aria-current="page">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <span>Courses</span>
                    </a>
                </li>
                <li>
                    <a href="profile.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Profile</span>
                    </a>
                </li>
            </ul>

            <!-- Nav Actions: Theme Toggle, User Chip & Logout Button -->
            <div class="nav-actions">
                <button id="theme-toggle-btn" class="btn-theme-toggle" aria-label="Toggle dark mode" title="Switch Theme">
                    <span class="theme-icon" id="theme-icon">🌙</span>
                </button>
                <div class="user-chip">
                    <div class="user-avatar" id="user-initial">S</div>
                    <span class="user-name" id="user-display-name">Student</span>
                </div>
                <button id="logout-btn" class="btn-logout" title="Sign out of EduLearn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>

        </div>
    </nav>

    <!-- ====================================================================
         2. COURSES PAGE MAIN CONTENT
         ==================================================================== -->
    <main class="courses-container">
        
        <!-- Header & Search Toolbar -->
        <section class="courses-header-section">
            <div class="courses-title-box">
                <h1>Explore Courses</h1>
                <p>Master in-demand skills through structured modules, interactive code, and hands-on quizzes.</p>
            </div>

            <!-- Search Filter Input -->
            <div class="courses-filter-box">
                <div class="search-input-wrapper">
                    <span class="search-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input 
                        type="text" 
                        id="course-search-input" 
                        class="search-input" 
                        placeholder="Search courses or topics..."
                        aria-label="Search courses"
                    >
                </div>
            </div>
        </section>

        <!-- Dynamic Courses Grid (Populated by JavaScript) -->
        <section class="courses-grid" id="courses-grid" aria-live="polite">
            <!-- Dynamic JavaScript Content Injected Here -->
        </section>

    </main>

    <!-- Global JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
